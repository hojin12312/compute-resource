<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css?v=2a58053d">
<style>
  /* 균일 정밀도 대 혼합 정밀도 (2026-07-31 신설).
     같은 평균 비트에서 **배분만 다르다**는 것이 요점이라 두 막대그래프의
     평균선을 같은 높이에 그립니다 — 균일은 평평하고 혼합은 들쭉날쭉한데
     평균선은 같은 자리입니다.

     비트 배분 예시는 README 7.1의 GGUF `Q4_K_M` 설명("대부분 Q4로 두되
     어텐션·출력처럼 민감한 텐서를 Q5/Q6로 보호")과 Unsloth Dynamic 2.0
     설명("MoE 전문가 FFN을 더 세게 누른다")을 그대로 옮긴 것입니다.
     특정 텐서의 실제 비트 수를 측정한 값이 아니라 **배분의 모양**입니다 —
     캡션에 그렇게 밝힙니다. */
  body { padding-top:42px; }

  /* 오른쪽 GUTTER만큼은 막대를 비워 둡니다 — 평균선 라벨이 앉을 자리입니다.
     라벨을 막대 위에 얹으면 값 라벨과 겹칩니다(2026-08-04 호진님 지적). */
  .chart { position:relative; height:430px; margin-top:16px;
           border-bottom:1px solid var(--c-3d4650); }
  .bars { position:absolute; left:0; right:70px; bottom:0; z-index:1;
          display:flex; align-items:flex-end; gap:7px; }
  .col { flex:1 1 0; display:flex; flex-direction:column; align-items:center; }
  .col i { display:block; width:100%; border-radius:3px 3px 0 0; font-style:normal; }
  .col b { margin-bottom:6px; font-size:10.5px; font-weight:700; color:var(--c-8b96a3); }
  .col.hi b { color:var(--c-22a7bd); }
  .col.lo b { color:var(--c-e0912a); }

  /* 평균선 — 두 패널에서 같은 높이입니다. 그게 이 그림의 전부입니다.
     막대보다 **나중에**(z-index 2) 그려야 5·6비트 막대를 가로지르는 것이 보입니다.
     높이는 JS가 막대 눈금과 똑같이 계산해 넣습니다 — 손으로 적으면 값 라벨을 뚫습니다. */
  .avg { position:absolute; left:0; right:0; height:0; z-index:2;
         border-top:1px dashed var(--c-c3ccd6); }
  .avg em { position:absolute; right:0; top:-9px; font-style:normal; font-size:11px;
            font-weight:700; color:var(--c-c3ccd6); background:var(--c-0d1117); padding:0 5px; }

  .xlab { display:flex; gap:7px; margin-top:7px; padding-right:70px; }
  .xlab span { flex:1 1 0; text-align:center; font-size:9.5px; color:var(--c-5d6773);
               line-height:1.25; }
</style>
</head>
<body>
  <h1>같은 <span class="cy">평균 4비트</span>인데 배분이 다릅니다</h1>
  <div class="sub">세로축은 그 텐서에 준 비트 수입니다 &middot; 점선이 평균이고
    <b style="color:var(--c-c3ccd6)">두 패널의 점선 높이는 같습니다</b> &mdash; 용량이 같다는 뜻입니다.</div>

  <div class="panels" style="margin-top:20px; gap:52px; align-items:flex-start">

    <div class="panel" style="width:576px">
      <div class="ptitle">균일 정밀도</div>
      <div class="pdesc">모든 자리에 같은 비트 &middot; 정할 것이 없습니다</div>
      <div class="chart"><div class="bars" id="uni"></div>
        <div class="avg"><em>평균 4.0</em></div></div>
      <div class="xlab" id="uxl"></div>
    </div>

    <div class="panel" style="width:576px">
      <div class="ptitle">혼합 정밀도</div>
      <div class="pdesc">민감한 곳에 더 주고 <b style="color:var(--c-c3ccd6)">둔감한 곳에서 회수</b></div>
      <div class="chart"><div class="bars" id="mix"></div>
        <div class="avg"><em>평균 4.0</em></div></div>
      <div class="xlab" id="mxl"></div>
    </div>

  </div>

  <div class="foot">
    <b>배분의 모양을 보여주는 그림입니다</b> &mdash; 특정 텐서의 실제 비트 수를 측정한 값이 아닙니다.
    기준은 <b>Q4_K_M</b>(어텐션·출력은 올리고)과 <b>Dynamic 2.0</b>(MoE 전문가는 더 누르고)의 배분 규칙입니다.
  </div>

<script>
/* [라벨, 비트] — 평균이 정확히 4.0이 되게 잡았습니다(합 48 / 12개).
   민감하다고 알려진 자리(임베딩·어텐션·출력)는 올리고, MoE 전문가 FFN에서 회수합니다. */
const T = [
  ['임베딩', 6], ['어텐션\nQ·K', 5], ['어텐션\nV·O', 5], ['전문가\nFFN 1', 3],
  ['전문가\nFFN 2', 3], ['전문가\nFFN 3', 3], ['전문가\nFFN 4', 3], ['공유\nFFN', 4],
  ['어텐션\n후반', 4], ['전문가\n후반', 3], ['정규화\n계수', 4], ['출력층', 5],
];
const MAXB = 6, H = 372;                 /* 6비트가 372px · 4비트가 248px = 평균선 자리 */
function draw(host, xhost, bits) {
  let h = '', x = '';
  T.forEach(([name], i) => {
    const b = bits(i);
    const cls = b > 4 ? ' hi' : (b < 4 ? ' lo' : '');
    const fill = b > 4 ? 'var(--c-0e8fa3)' : (b < 4 ? 'var(--c-c47d15)' : 'var(--c-3d4650)');
    h += '<div class="col' + cls + '"><b>' + b + '</b><i style="height:' +
         (b / MAXB * H).toFixed(0) + 'px; background:' + fill + '"></i></div>';
    x += '<span>' + name.replace('\n', '<br>') + '</span>';
  });
  host.innerHTML = h; xhost.innerHTML = x;
}
draw(document.getElementById('uni'), document.getElementById('uxl'), () => 4);
draw(document.getElementById('mix'), document.getElementById('mxl'), i => T[i][1]);
/* 평균선은 4비트 막대의 윗면과 같은 높이입니다 — 막대와 같은 눈금으로 계산해
   넣습니다. 손으로 px를 적으면 값 라벨을 뚫습니다(옛 판이 8px 위에 있었습니다). */
document.querySelectorAll('.avg').forEach(a => { a.style.bottom = (4 / MAXB * H) + 'px'; });
</script>
</body>
</html>
