<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css?v=2a58053d">
<style>
  body { padding-top:70px; }
  .chart { display:flex; align-items:flex-end; gap:0; height:330px; margin-top:26px; justify-content:space-around; }
  .col { flex:1; max-width:150px; display:flex; flex-direction:column; align-items:center; }
  .pair { display:flex; align-items:flex-end; gap:5px; }
  .b { width:38px; border-radius:3px 3px 0 0; }
  .vals { display:flex; gap:4px; margin-bottom:10px; }
  .v { width:38px; text-align:center; font-size:12px; font-weight:700; line-height:1.25; }
  .v span { display:block; font-size:10px; font-weight:400; color:var(--c-6b7684); margin-top:2px; }
  .base { border-top:1px solid var(--c-21262d); display:flex; justify-content:space-around; }
  .meta { flex:1; max-width:150px; text-align:center; padding-top:12px; }
  .gen { font-size:14px; font-weight:700; color:var(--c-e6edf3); }
  .yr { font-size:12px; color:var(--c-7d8896); margin-top:4px; }
  .node { font-size:11.5px; color:var(--c-5d6773); margin-top:5px; }
</style>
</head>
<body>
  <h1>GPU 세대별 주요 로드맵</h1>
  <div class="sub">Volta(V100)부터 Rubin까지 H200 (100% 기준) 메모리 용량 및 대역폭 상대 비교</div>

  <div class="legend">
    <div><span class="sw amber"></span>메모리 용량</div>
    <div><span class="sw cyan"></span>메모리 대역폭</div>
    <div style="color:var(--c-7d8896)">막대 높이 = <b style="color:var(--c-c3ccd6)">H200 기준 배수 (H200 = 1.0x / 100%)</b></div>
  </div>

  <div style="width:1150px; margin:0 auto;">
    <div class="chart" id="chart"></div>
    <div class="base" id="base"></div>
  </div>

  <div class="foot">
    용량은 <b>3장의 청구서</b>를, 대역폭은 <b>5.2장의 병목</b>을 직접 건드립니다.
  </div>

<script>
const D = [
  { gen: 'V100',   yr: '2017', node: 'TSMC 12nm', mem: 32,  bw: 0.9 },
  { gen: 'A100',   yr: '2020', node: 'TSMC 7nm',  mem: 80,  bw: 2.0 },
  { gen: 'H100',   yr: '2022', node: 'TSMC 4N',   mem: 80,  bw: 3.35 },
  { gen: 'H200',   yr: '2024', node: 'TSMC 4N',   mem: 141, bw: 4.8,  mark: 'am' },
  { gen: 'B200',   yr: '2024', node: 'TSMC 4NP',  mem: 192, bw: 8 },
  { gen: 'B300',   yr: '2025', node: 'TSMC 4NP',  mem: 288, bw: 8,    mark: 'cy' },
  { gen: 'Rubin',  yr: '2026', node: 'TSMC N3',   mem: 288, bw: 22 },
];
const MEM0 = 141, BW0 = 4.8; // H200 100% 기준
const MAX = 4.58, H = 268;
const chart = document.getElementById('chart'), base = document.getElementById('base');
D.forEach(d => {
  const mx = d.mem / MEM0, bx = d.bw / BW0;
  const col = document.createElement('div'); col.className = 'col';
  col.innerHTML =
    '<div class="vals">' +
      '<div class="v am">×' + mx.toFixed(2) + '<span>' + d.mem + 'GB</span></div>' +
      '<div class="v cy">×' + bx.toFixed(2) + '<span>' + d.bw + 'TB/s</span></div>' +
    '</div>' +
    '<div class="pair">' +
      '<div class="b amber" style="height:' + Math.max(10, Math.round(mx / MAX * H)) + 'px"></div>' +
      '<div class="b cyan" style="height:' + Math.max(10, Math.round(bx / MAX * H)) + 'px"></div>' +
    '</div>';
  chart.appendChild(col);

  const m = document.createElement('div'); m.className = 'meta';
  const gcls = d.gen === 'H200' ? ' style="color:var(--c-e0912a)"' : d.mark === 'cy' ? ' style="color:var(--c-22a7bd)"' : '';
  m.innerHTML = '<div class="gen"' + gcls + '>' + d.gen + (d.gen === 'H200' ? ' <span style="font-size:10px; color:var(--c-e0912a)">(100%)</span>' : '') + '</div>' +
                '<div class="yr">' + d.yr + '</div><div class="node">' + d.node + '</div>';
  base.appendChild(m);
});
</script>
</body>
</html>
