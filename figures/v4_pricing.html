<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css?v=f9db9358">
<style>
  body { padding-top:42px; }
  h1 { font-size:31px; }
  .legend {
    position:absolute;
    top:102px;
    right:56px;
    gap:18px;
    margin:0;
    font-size:11px;
  }
  .legend .dot {
    width:10px;
    height:10px;
    border-radius:50%;
  }
  .chart {
    position:relative;
    height:498px;
    margin-top:28px;
    padding:38px 18px 8px 18px;
    border:1px solid var(--c-333d47);
    border-radius:12px;
    background:var(--c-161b22);
  }
  .plot {
    position:absolute;
    top:38px;
    left:240px;
    right:24px;
    bottom:35px;
  }
  .gridline {
    position:absolute;
    top:0;
    bottom:0;
    width:1px;
    background:var(--c-2b333d);
  }
  .gridline span {
    position:absolute;
    top:-22px;
    left:0;
    transform:translateX(-50%);
    color:var(--c-7d8896);
    font:650 9.5px "IBM Plex Mono", "Pretendard Variable", monospace;
    white-space:nowrap;
  }
  .rows {
    position:absolute;
    inset:38px 18px 35px 18px;
    display:grid;
    grid-template-rows:repeat(11,1fr);
  }
  .row {
    position:relative;
    display:grid;
    grid-template-columns:214px 1fr;
    align-items:center;
    border-bottom:1px solid var(--c-21262d);
  }
  .row:last-child { border-bottom:0; }
  .row.hero {
    margin:1px -7px;
    padding:0 7px;
    border:1px solid var(--c-17505c);
    border-radius:6px;
    background:var(--c-0f2930);
  }
  .model {
    display:flex;
    align-items:center;
    min-width:0;
    font-size:11.5px;
    font-weight:720;
    white-space:nowrap;
  }
  .country {
    width:25px;
    height:15px;
    flex:0 0 auto;
    margin-right:8px;
    border:1px solid var(--c-0e8fa3);
    border-radius:8px;
    color:var(--c-22a7bd);
    font:750 7.5px "IBM Plex Mono", "Pretendard Variable", monospace;
    line-height:13px;
    text-align:center;
  }
  .us .country { border-color:var(--c-8b6ff0); color:var(--c-a48cf5); }
  .model sup {
    margin-left:3px;
    color:var(--c-e0912a);
    font-size:8px;
  }
  .track {
    position:relative;
    height:100%;
  }
  .range {
    position:absolute;
    top:50%;
    height:2px;
    transform:translateY(-50%);
    background:var(--c-3f4c58);
  }
  .mark {
    position:absolute;
    top:50%;
    width:9px;
    height:9px;
    transform:translate(-50%,-50%);
    border:2px solid var(--c-161b22);
    border-radius:50%;
  }
  .hero .mark { border-color:var(--c-0f2930); }
  .mark.cache { background:var(--c-8b6ff0); }
  .mark.input { background:var(--c-8b96a3); }
  .mark.output { width:11px; height:11px; background:var(--c-0e8fa3); }
  .value {
    position:absolute;
    top:50%;
    transform:translate(7px,-50%);
    color:var(--c-9aa7b4);
    font:650 8.8px "IBM Plex Mono", "Pretendard Variable", monospace;
    white-space:nowrap;
  }
  .value.cache {
    transform:translate(-100%,-50%);
    padding-right:7px;
    color:var(--c-a48cf5);
  }
  .value.output {
    color:var(--c-22a7bd);
    font-size:9.5px;
    font-weight:800;
  }
  .cache-band {
    position:absolute;
    top:50%;
    height:8px;
    transform:translateY(-50%);
    border-radius:5px;
    background:var(--c-8b6ff0);
  }
  .cache-band + .value { transform:translate(-100%,-50%); }
  .insight {
    height:67px;
    display:grid;
    grid-template-columns:1fr 1px 1fr;
    align-items:center;
    gap:28px;
    margin-top:15px;
    padding:0 31px;
    border:1px solid var(--c-333d47);
    border-radius:10px;
    background:var(--c-161b22);
  }
  .divider { width:1px; height:38px; background:var(--c-333d47); }
  .statement {
    display:flex;
    align-items:center;
    gap:16px;
  }
  .statement strong {
    color:var(--c-22a7bd);
    font-size:25px;
    letter-spacing:-.04em;
  }
  .statement span {
    color:var(--c-9aa7b4);
    font-size:11.5px;
    line-height:1.35;
  }
  .statement b { color:var(--c-e6edf3); }
  .foot { bottom:16px; padding-top:11px; font-size:10.5px; }
</style>
</head>
<body>
  <h1>API 가격 &mdash; <span class="cy">점이 왼쪽일수록 쌉니다</span></h1>
  <div class="sub">2026년 7월 · 1M 토큰당 USD · 자릿수 차이를 한 화면에 보이기 위한 로그 축</div>

  <div class="legend">
    <div><span class="dot violet"></span>캐시 hit</div>
    <div><span class="dot gray"></span>입력</div>
    <div><span class="dot cyan"></span>출력</div>
  </div>

  <div class="chart">
    <div class="plot" id="plot"></div>
    <div class="rows" id="rows"></div>
  </div>

  <div class="insight">
    <div class="statement"><strong>179×</strong><span>출력 가격<br><b>Flash $0.28 → Fable $50</b></span></div>
    <div class="divider"></div>
    <div class="statement"><strong>0.83–2%</strong><span>캐시 hit ÷ 입력<br><b>DeepSeek Pro · Flash</b></span></div>
  </div>

  <div class="foot">
    * Qwen3.7-Max 캐시는 explicit 10% / implicit 20% · Sonnet 5는 표준가 기준, 2026-08-31까지는 출시 할인가 $2 / $0.2 / $10
  </div>

<script>
const models = [
  {name:'DeepSeek V4 Flash', market:'cn', cache:.0028, input:.14, output:.28, hero:true},
  {name:'DeepSeek V4 Pro', market:'cn', cache:.003625, input:.435, output:.87},
  {name:'MiniMax M3', market:'cn', cache:.06, input:.30, output:1.20},
  {name:'GLM-5.2', market:'cn', cache:.26, input:1.40, output:4.40},
  {name:'Qwen3.7-Max', market:'cn', cache:.165, cacheMax:.33, input:1.65, output:4.951, note:true},
  {name:'Kimi K3', market:'cn', cache:.30, input:3.00, output:15.00},
  {name:'GPT-5.6 Terra', market:'us', cache:.25, input:2.50, output:15.00},
  {name:'Claude Sonnet 5', market:'us', cache:.30, input:3.00, output:15.00, note:true},
  {name:'Claude Opus 5', market:'us', cache:.50, input:5.00, output:25.00},
  {name:'GPT-5.6 Sol', market:'us', cache:.50, input:5.00, output:30.00},
  {name:'Claude Fable 5', market:'us', cache:1.00, input:10.00, output:50.00}
];
const ticks = [.001,.01,.1,1,10,100];
const pos = value => (Math.log10(value) + 3) / 5 * 100;
const money = value => '$' + String(value);

const plot = document.getElementById('plot');
for (const tick of ticks) {
  const line = document.createElement('div');
  line.className = 'gridline';
  line.style.left = pos(tick) + '%';
  line.innerHTML = `<span>${money(tick)}</span>`;
  plot.appendChild(line);
}

const rows = document.getElementById('rows');
for (const m of models) {
  const row = document.createElement('div');
  row.className = `row ${m.market === 'us' ? 'us' : ''} ${m.hero ? 'hero' : ''}`;
  const cacheLabel = m.cacheMax ? `${money(m.cache)}–${money(m.cacheMax)}` : money(m.cache);
  const band = m.cacheMax
    ? `<span class="cache-band" style="left:${pos(m.cache)}%;width:${pos(m.cacheMax)-pos(m.cache)}%"></span>`
    : `<span class="mark cache" style="left:${pos(m.cache)}%"></span>`;
  row.innerHTML = `
    <div class="model"><span class="country">${m.market === 'us' ? 'US' : 'CN'}</span>${m.name}${m.note ? '<sup>*</sup>' : ''}</div>
    <div class="track">
      <span class="range" style="left:${pos(m.cache)}%;width:${pos(m.output)-pos(m.cache)}%"></span>
      ${band}<span class="value cache" style="left:${pos(m.cache)}%">${cacheLabel}</span>
      <span class="mark input" style="left:${pos(m.input)}%"></span><span class="value" style="left:${pos(m.input)}%">${money(m.input)}</span>
      <span class="mark output" style="left:${pos(m.output)}%"></span><span class="value output" style="left:${pos(m.output)}%">${money(m.output)}</span>
    </div>`;
  rows.appendChild(row);
}
</script>
</body>
</html>
